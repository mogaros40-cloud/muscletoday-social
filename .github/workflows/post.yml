name: post
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - name: post due items
        env:
          IG_TOKEN_KR: ${{ secrets.IG_TOKEN_KR }}
          IG_USER_ID_KR: ${{ secrets.IG_USER_ID_KR }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          THREADS_TOKEN_KR: ${{ secrets.THREADS_TOKEN_KR }}
          THREADS_TOKEN_EN: ${{ secrets.THREADS_TOKEN_EN }}
          THREADS_USER_ID_KR: ${{ secrets.THREADS_USER_ID_KR }}
          THREADS_USER_ID_EN: ${{ secrets.THREADS_USER_ID_EN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_TOKEN_KEY: ${{ secrets.TIKTOK_TOKEN_KEY }}
        run: python post.py
      - name: save state
        if: always()
        run: |
          git config user.name "muscletoday-bot"
          git config user.email "muscletoday.app@gmail.com"
          git add -A posted.json media tiktok_token.enc status.json
          git diff --cached --quiet || (git commit -m "posted state" && (git push || (git pull --rebase && git push)))
